<!--
    版式刻意对齐「用户设置」页第三列（power-user-options-block）的原生写法：
      段标题      <h4>
      开关        <label class="checkbox_label"><input type="checkbox"><span>
      滑块        成对的 .neo-range-slider + .neo-range-input[data-for]
      说明        [title] + .fa-circle-info.opacity50p
      操作        .menu_button.menu_button_icon
    所有文案走 data-i18n，中文词条在同目录 locales/zh-cn.json，由核心的
    addExtensionLocale() 依据 manifest.i18n 自动载入。
-->
<div id="ctxwm_settings" name="ContextWindowToggles">
    <h4 data-i18n="Context Window">Context Window</h4>

    <div id="ctxwm_core_patch" class="ctxwm-core-patch"></div>

    <div id="ctxwm_toggles">
        <label class="checkbox_label" for="ctxwm_enabled"
            title="Let this panel decide the chat-history window. Off = fall back to the built-in sticky behaviour."
            data-i18n="[title]Let this panel decide the chat-history window. Off = fall back to the built-in sticky behaviour.">
            <input type="checkbox" id="ctxwm_enabled">
            <span data-i18n="Enable window management">Enable window management</span>
        </label>

        <div class="flex-container">
            <div class="alignitemscenter flex-container flexFlowColumn flexBasis48p flexGrow flexShrink gap0">
                <small>
                    <span data-i18n="History Window Cap">History Window Cap</span>
                    <div class="fa-solid fa-circle-info opacity50p"
                        title="Upper bound for the chat-history part of the prompt only. The system prompt and the character card are not counted."
                        data-i18n="[title]Upper bound for the chat-history part of the prompt only. The system prompt and the character card are not counted."></div>
                </small>
                <input class="neo-range-slider" type="range" id="ctxwm_history_cap" min="0" max="200000" step="1000">
                <input class="neo-range-input" type="number" id="ctxwm_history_cap_counter" min="0" max="200000" step="1000" data-for="ctxwm_history_cap">
                <small data-i18n="(0 = No limit)">(0 = No limit)</small>
            </div>

            <div class="alignitemscenter flex-container flexFlowColumn flexBasis48p flexGrow flexShrink gap0">
                <small>
                    <span data-i18n="Kept on Overflow">Kept on Overflow</span>
                    <div class="fa-solid fa-circle-info opacity50p"
                        title="How much of the window survives when it no longer fits. The window is dropped in one step, never slid message by message. Lower = a bigger drop, but the prefix stays byte-identical in between (keeps the prompt cache warm). Higher = gentler drops, but the prefix changes more often."
                        data-i18n="[title]How much of the window survives when it no longer fits. The window is dropped in one step, never slid message by message. Lower = a bigger drop, but the prefix stays byte-identical in between (keeps the prompt cache warm). Higher = gentler drops, but the prefix changes more often."></div>
                </small>
                <input class="neo-range-slider" type="range" id="ctxwm_keep" min="10" max="100" step="5">
                <input class="neo-range-input" type="number" id="ctxwm_keep_counter" min="10" max="100" step="5" data-for="ctxwm_keep">
                <small data-i18n="(%)">(%)</small>
            </div>
        </div>

        <label class="checkbox_label" for="ctxwm_sticky"
            title="Keep the window append-only so the cached prefix stays valid. Turning this off restores the upstream sliding window: a smooth token curve, but the prefix changes every turn and the cache rarely hits."
            data-i18n="[title]Keep the window append-only so the cached prefix stays valid. Turning this off restores the upstream sliding window: a smooth token curve, but the prefix changes every turn and the cache rarely hits.">
            <input type="checkbox" id="ctxwm_sticky">
            <span data-i18n="Sticky window (keep prefix stable)">Sticky window (keep prefix stable)</span>
        </label>
    </div>

    <div id="ctxwm_status" class="ctxwm-status"></div>

    <div class="flex-container justifyCenter">
        <div class="menu_button menu_button_icon" id="ctxwm_refresh">
            <i class="fa-solid fa-rotate"></i>
            <span data-i18n="Refresh">Refresh</span>
        </div>
        <div class="menu_button menu_button_icon" id="ctxwm_reset">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span data-i18n="Reset window">Reset window</span>
        </div>
    </div>

    <small class="ctxwm-hint">
        <span data-i18n="100% is equivalent to turning the sticky window off. Both move the window by the smallest step every turn. No setting is both smooth and cache-friendly.">100% is equivalent to turning the sticky window off. Both move the window by the smallest step every turn. No setting is both smooth and cache-friendly.</span>
    </small>
</div>
